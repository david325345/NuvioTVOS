name: Calendar PR test build (fork)

# Fork only, never part of the PR: builds an unsigned IPA of the calendar
# PR branch and runs its tests, plus the whole suite for comparison.
on:
  push:
    branches: [calendar-pr-test]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Tuist
        run: brew install tuist
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          report() {
            grep -E "error: " build.log | grep -v "produced no further output" \
              | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          }
          trap 'report' ERR
          bash scripts/build-ipa.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-calendar-pr-unsigned-ipa
          path: build-ipa/NuvioTV-unsigned.ipa
          retention-days: 7

  calendar-tests:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Tuist
        run: brew install tuist
      - name: Generate Xcode project
        run: tuist generate --path tvosApp --no-open
      - name: Calendar unit tests
        env:
          NUVIO_TEST_ARTIFACTS: ${{ runner.temp }}/nuvio-tests
          NUVIO_DERIVED_DATA: ${{ runner.temp }}/NuvioTVDerivedData
        run: |
          set -o pipefail
          report() {
            grep -E "error: |XCTAssert|failed \(" "$NUVIO_TEST_ARTIFACTS/xcodebuild.log" 2>/dev/null \
              | grep -v "produced no further output" \
              | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          }
          trap 'report' ERR
          bash scripts/test-tvos.sh \
            -only-testing:NuvioTVTests/CalendarDayTests \
            -only-testing:NuvioTVTests/CalendarBuilderTests \
            -only-testing:NuvioTVTests/CalendarServiceTests \
            -only-testing:NuvioTVTests/CalendarSuggestionTests \
            -only-testing:NuvioTVTests/CalendarAnimeTodayTests \
            -only-testing:NuvioTVTests/CalendarAnimeIdTests \
            -only-testing:NuvioTVTests/CalendarAnimeTimesTests \
            -only-testing:NuvioTVTests/CalendarReadableTitleTests \
            -only-testing:NuvioTVTests/DetailsEpisodeFocusTests \
            -only-testing:NuvioTVTests/CalendarLibraryListTests \
            -only-testing:NuvioTVTests/CalendarFilterTests \
            -only-testing:NuvioTVTests/CalendarEntryRulesTests \
            -only-testing:NuvioTVTests/CalendarEntryStatusModelTests \
            -only-testing:NuvioTVTests/CalendarTvmazeTimesTests \
            -only-testing:NuvioTVTests/CalendarSnapshotTests \
            -only-testing:NuvioTVTests/CalendarHomeTodayTests

  all-tests:
    runs-on: xcode-27
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Tuist
        run: brew install tuist
      - name: Generate Xcode project
        run: tuist generate --path tvosApp --no-open
      - name: Whole test suite
        env:
          NUVIO_TEST_ARTIFACTS: ${{ runner.temp }}/nuvio-tests
          NUVIO_DERIVED_DATA: ${{ runner.temp }}/NuvioTVDerivedData
        run: |
          set -o pipefail
          report() {
            grep -E "error: |XCTAssert|failed \(" "$NUVIO_TEST_ARTIFACTS/xcodebuild.log" 2>/dev/null \
              | grep -v "produced no further output" \
              | sort -u | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          }
          trap 'report' ERR
          bash scripts/test-tvos.sh
