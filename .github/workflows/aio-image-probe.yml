name: AIOStreams from the official image (fork experiment)

# Fork only, never part of a PR: installs and runs AIOStreams straight from its
# official Docker image the way Nuvio does on the TV — bootstrap.mjs and
# image-install.mjs from aio-node/installer, Node.js 24 as on Apple TV (no JIT,
# WebAssembly through polywasm) — through smoke.sh: a pinned version and the
# newest one (the default source).
on:
  push:
    branches: [aio-node, aio-anilist-plugins, aio-final-test]
    paths:
      - aio-node/installer/**
      - aio-node/aio-package/smoke.sh
      - aio-node/aio-package/drop-ports.py
      - aio-node/aio-package/ffprobe-bridge-test.mjs
      - .github/workflows/aio-image-probe.yml
  workflow_dispatch:
    inputs:
      tag:
        description: AIOStreams image tag for the pinned run
        required: false
        default: v2.37.0

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Not TAG: AIOStreams refuses to start when TAG is set (its own, read-only).
      AIO_IMAGE_TAG: ${{ github.event.inputs.tag || 'v2.37.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer (as Nuvio carries it)
        run: bash aio-node/installer/assemble.sh "$RUNNER_TEMP/installer"
      - name: Pinned version (ghcr.io/viren070/aiostreams:${{ env.AIO_IMAGE_TAG }})
        env:
          ANIME_DB_LEVEL_OF_DETAIL: none
        run: bash aio-node/aio-package/smoke.sh "$RUNNER_TEMP/installer" "ghcr.io/viren070/aiostreams:$AIO_IMAGE_TAG"
      - name: Newest version (the default source)
        if: always()
        env:
          ANIME_DB_LEVEL_OF_DETAIL: required
        run: bash aio-node/aio-package/smoke.sh "$RUNNER_TEMP/installer" ghcr.io/viren070/aiostreams
      # Prepared ahead of Nuvio's side (installer/FFPROBE.md): AIOStreams' own
      # ffprobe code through the bridge, a stand-in for Nuvio answering with
      # the real ffprobe.
      - name: ffprobe through Nuvio (newest version)
        if: always()
        # A step that hangs ends on its own, so the job keeps its log.
        timeout-minutes: 12
        run: |
          echo "ffmpeg…"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          echo "AIOStreams (newest)…"
          home="$RUNNER_TEMP/ffprobe-aio"
          result=$(node aio-node/installer/image-install.mjs --source ghcr.io/viren070/aiostreams --home "$home" --shims "$RUNNER_TEMP/installer/shims" | tail -1)
          name=$(node -e 'console.log(JSON.parse(process.argv[1]).name)' "$result")
          media="$RUNNER_TEMP/media"
          mkdir -p "$media"
          printf '1\n00:00:00,000 --> 00:00:01,500\nAhoj\n' > "$media/subs.srt"
          ffmpeg -loglevel error -y -f lavfi -i testsrc=duration=2:size=320x240:rate=25 -f lavfi -i sine=duration=2 -i "$media/subs.srt" \
            -map 0 -map 1 -map 2 -c:v libx264 -c:a aac -c:s srt -metadata:s:a:0 language=jpn -metadata:s:s:0 language=cze "$media/sample.mkv"
          echo "the bridge test…"
          node aio-node/aio-package/ffprobe-bridge-test.mjs "$home/$name" "$RUNNER_TEMP/installer" "$media/sample.mkv"
