name: AIOStreams from the official image (fork experiment)

# Fork only, never part of a PR: installs and runs AIOStreams straight from its
# official Docker image the way Nuvio does on the TV — bootstrap.mjs and
# image-install.mjs from aio-node/installer, Node.js 24 as on Apple TV (no JIT,
# WebAssembly through polywasm) — through smoke.sh: a pinned version and the
# newest one (the default source).
on:
  push:
    branches: [aio-node]
    paths:
      - aio-node/installer/**
      - aio-node/aio-package/smoke.sh
      - .github/workflows/aio-image-probe.yml
  workflow_dispatch:
    inputs:
      tag:
        description: AIOStreams image tag for the pinned run
        required: false
        default: v2.37.0

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Not TAG: AIOStreams refuses to start when TAG is set (its own, read-only).
      AIO_IMAGE_TAG: ${{ github.event.inputs.tag || 'v2.37.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Installer (as Nuvio carries it)
        run: bash aio-node/installer/assemble.sh "$RUNNER_TEMP/installer"
      - name: Pinned version (ghcr.io/viren070/aiostreams:${{ env.AIO_IMAGE_TAG }})
        env:
          ANIME_DB_LEVEL_OF_DETAIL: none
        run: bash aio-node/aio-package/smoke.sh "$RUNNER_TEMP/installer" "ghcr.io/viren070/aiostreams:$AIO_IMAGE_TAG"
      - name: Newest version (the default source)
        if: always()
        env:
          ANIME_DB_LEVEL_OF_DETAIL: required
        run: bash aio-node/aio-package/smoke.sh "$RUNNER_TEMP/installer" ghcr.io/viren070/aiostreams
