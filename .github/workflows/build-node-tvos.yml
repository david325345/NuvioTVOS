name: Node.js for tvOS (fork experiment)

# Fork only, never part of a PR: builds nodejs-mobile (Node.js 24) as
# NodeMobile.xcframework for tvOS, the runtime for running the original
# AIOStreams inside Nuvio on Apple TV. See aio-node/node-tvos/tvos_patch.py.
on:
  push:
    branches: [aio-node]
    paths:
      - aio-node/node-tvos/**
      - .github/workflows/build-node-tvos.yml
  workflow_dispatch:

env:
  NODEJS_MOBILE_TAG: v24.20.0-0
  TVOS_DEPLOYMENT_TARGET: "18.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [arm64, arm64-simulator]
    runs-on: xcode-27
    timeout-minutes: 350
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Node + V8 objects, archives and the compiler cache need ~25 GB.
        run: |
          df -h / | tail -1
          keep="$(xcode-select -p | sed 's#/Contents/Developer##')"
          for app in /Applications/Xcode*.app; do
            [ "$app" = "$keep" ] || sudo rm -rf "$app" &
          done
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" ~/Library/Android ~/.android ~/.dotnet /usr/local/share/dotnet \
            /Users/runner/hostedtoolcache/CodeQL /Users/runner/hostedtoolcache/go /Users/runner/hostedtoolcache/Ruby \
            /Users/runner/hostedtoolcache/PyPy ~/.ghcup /usr/local/lib/node_modules &
          wait
          df -h / | tail -1
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-path
          xcrun --sdk appletvsimulator --show-sdk-path
          echo "cores: $(sysctl -n hw.ncpu)"
          brew list ccache >/dev/null 2>&1 || brew install ccache

      - name: Source (nodejs-mobile ${{ env.NODEJS_MOBILE_TAG }})
        run: git clone --depth 1 --branch "$NODEJS_MOBILE_TAG" https://github.com/digidem/nodejs-mobile node-src

      - name: Patch for tvOS
        run: python3 aio-node/node-tvos/tvos_patch.py node-src "$TVOS_DEPLOYMENT_TARGET"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-node-tvos-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: ccache-node-tvos-${{ matrix.target }}-

      - name: Build
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/cc"
          printf '#!/bin/sh\nexec ccache clang "$@"\n' > "$RUNNER_TEMP/cc/cc"
          printf '#!/bin/sh\nexec ccache clang++ "$@"\n' > "$RUNNER_TEMP/cc/cxx"
          chmod +x "$RUNNER_TEMP/cc/cc" "$RUNNER_TEMP/cc/cxx"
          export CC="$RUNNER_TEMP/cc/cc" CXX="$RUNNER_TEMP/cc/cxx"
          export CC_host="$CC" CXX_host="$CXX"
          cd node-src
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install --quiet setuptools
          ./tools/ios_framework_prepare.sh ${{ matrix.target }} 2>&1 | tee ../build.log

      - name: Report errors
        if: failure()
        run: |
          df -h / | tail -1
          grep -E "(error|fatal error): " build.log | sed -E 's#^.*/node-src/##' | sort | uniq -c | sort -rn | head -60 \
            | while IFS= read -r line; do echo "::error::$line"; done
          grep -cE "error: " build.log || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-node-tvos-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: build.log

      - name: Headers
        if: matrix.target == 'arm64'
        run: |
          cd node-src
          bash tools/copy_libnode_headers.sh ios
          mkdir -p ../headers && cp -R out_ios/libnode/include ../headers/

      - uses: actions/upload-artifact@v4
        with:
          name: node-tvos-${{ matrix.target }}
          path: node-src/out_ios_${{ matrix.target }}

      - if: matrix.target == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: node-tvos-headers
          path: headers

  combine:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: node-tvos-*
      - name: NodeMobile.xcframework (tvOS)
        run: |
          set -euo pipefail
          find . -maxdepth 6 -name NodeMobile.framework -type d
          DEVICE=$(find node-tvos-arm64 -path '*Release-appletvos/NodeMobile.framework' -type d | head -1)
          SIM=$(find node-tvos-arm64-simulator -path '*Release-appletvsimulator/NodeMobile.framework' -type d | head -1)
          xcodebuild -create-xcframework -framework "$DEVICE" -framework "$SIM" -output out/NodeMobile.xcframework
          cp -R node-tvos-headers/include out/
          du -sh out/NodeMobile.xcframework
          echo "::notice::NodeMobile.xcframework for tvOS $(du -sh out/NodeMobile.xcframework | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: NodeMobile-tvos
          path: out
