name: Usenet account sync test build (fork)

# Fork only, never part of the PR: builds the unsigned IPA of the Usenet
# account sync PR branch, runs the Usenet tests, and the whole suite for comparison.
on:
  push:
    branches: [usenet-sync-ci]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Tuist
        run: brew install tuist
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          report() {
            grep -E "error: " build.log | grep -v "produced no further output" \
              | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          }
          trap 'report' ERR
          bash scripts/build-ipa.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-usenet-sync-unsigned-ipa
          path: build-ipa/NuvioTV-unsigned.ipa
          retention-days: 7

  usenet-tests:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Tuist
        run: brew install tuist
      - name: Generate Xcode project
        run: tuist generate --path tvosApp --no-open
      - name: Usenet tests
        env:
          NUVIO_TEST_ARTIFACTS: ${{ runner.temp }}/nuvio-tests
          NUVIO_DERIVED_DATA: ${{ runner.temp }}/NuvioTVDerivedData
        run: |
          set -o pipefail
          report() {
            grep -E "error: |XCTAssert|failed \(" "$NUVIO_TEST_ARTIFACTS/xcodebuild.log" 2>/dev/null \
              | grep -v "produced no further output" \
              | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          }
          trap 'report' ERR
          bash scripts/test-tvos.sh \
            -only-testing:NuvioTVTests/UsenetSettingsSyncTests \
            -only-testing:NuvioTVTests/UsenetCoreTests \
            -only-testing:NuvioTVTests/UsenetNZBTests \
            -only-testing:NuvioTVTests/UsenetFormatTests \
            -only-testing:NuvioTVTests/UsenetSourceTests \
            -only-testing:NuvioTVTests/UsenetLayoutTests \
            -only-testing:NuvioTVTests/UsenetServerTests \
            -only-testing:NuvioTVTests/UsenetPoolTests
      - name: Usenet test results
        if: always()
        env:
          NUVIO_TEST_ARTIFACTS: ${{ runner.temp }}/nuvio-tests
        run: |
          xcrun xcresulttool get test-results tests \
            --path "$NUVIO_TEST_ARTIFACTS/Tests.xcresult" --format json > tests.json || exit 0
          ruby -rjson -e '
            suites = ["UsenetSettingsSyncTests", "UsenetCoreTests", "UsenetNZBTests", "UsenetFormatTests", "UsenetSourceTests", "UsenetLayoutTests", "UsenetServerTests", "UsenetPoolTests"]
            def walk(node, suite, suites, out)
              name = node["name"].to_s
              suite = name if node["nodeType"] == "Test Suite"
              if node["nodeType"] == "Test Case" && suites.include?(suite)
                out << ["#{suite}.#{name}", node["result"]]
              end
              (node["children"] || []).each { |child| walk(child, suite, suites, out) }
            end
            out = []
            JSON.parse(File.read("tests.json")).fetch("testNodes", []).each { |n| walk(n, nil, suites, out) }
            passed = out.count { |_, r| r == "Passed" }
            puts "::notice::Usenet tests #{passed}/#{out.size} passed"
            out.reject { |_, r| r == "Passed" }.each { |n, r| puts "::error::#{n}: #{r}" }
          '

  all-tests:
    runs-on: xcode-27
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Tuist
        run: brew install tuist
      - name: Generate Xcode project
        run: tuist generate --path tvosApp --no-open
      - name: Whole test suite
        env:
          NUVIO_TEST_ARTIFACTS: ${{ runner.temp }}/nuvio-tests
          NUVIO_DERIVED_DATA: ${{ runner.temp }}/NuvioTVDerivedData
        run: |
          set -o pipefail
          report() {
            grep -E "error: |XCTAssert|failed \(" "$NUVIO_TEST_ARTIFACTS/xcodebuild.log" 2>/dev/null \
              | grep -v "produced no further output" \
              | sort -u | head -60 | while IFS= read -r line; do echo "::error::$line"; done
          }
          trap 'report' ERR
          bash scripts/test-tvos.sh
